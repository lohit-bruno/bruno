info:
  name: Basic Auth 200
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/auth/basic/protected"
  body:
    type: json
    data: ""
  auth:
    type: basic
    username: bruno
    password: "{{basic_auth_password}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Authentication successful

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
