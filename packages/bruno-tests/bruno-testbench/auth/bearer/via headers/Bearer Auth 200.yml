info:
  name: Bearer Auth 200
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/auth/bearer/protected"
  headers:
    - name: Authorization
      value: Bearer {{bearer_auth_token}}
  body:
    type: json
    data: ""

runtime:
  variables:
    - name: a-c
      value: foo
  scripts:
    - type: after-response
      code: bru.setEnvVar("foo", "bar");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Authentication successful

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
