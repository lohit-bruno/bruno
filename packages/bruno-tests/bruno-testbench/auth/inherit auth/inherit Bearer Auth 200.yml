info:
  name: inherit Bearer Auth 200
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/auth/bearer/protected"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("foo", "bar");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: Authentication successful

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
