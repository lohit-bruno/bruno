info:
  name: Test Redirect
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/redirect-to-ping"

runtime:
  scripts:
    - type: tests
      code: |-
        test("should redirect to ping", function() {
          const data = res.getBody();
          expect(data).to.equal('pong');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
