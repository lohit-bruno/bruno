info:
  name: env vars
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/echo/json"
  body:
    type: json
    data: |-
      {
        "envVar1": "{{env.var1}}",
        "envVar2": "{{env-var2}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return json", function() {
          expect(res.getBody()).to.eql({
            "envVar1": "envVar1",
            "envVar2": "envVar2"
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
