info:
  name: getMethod
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/ping"

runtime:
  scripts:
    - type: tests
      code: |-
        test("req.getMethod()()", function() {
          const method = req.getMethod();
          expect(method).to.equal("GET");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
