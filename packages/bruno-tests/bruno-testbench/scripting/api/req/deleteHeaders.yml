info:
  name: deleteHeaders
  type: http
  seq: 13

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: X-Frame-Options
      value: "1"
    - name: Content-Type
      value: application/json

runtime:
  scripts:
    - type: before-request
      code: req.deleteHeaders(['X-Frame-Options']);
    - type: tests
      code: |-
        test("req.deleteHeaders(names)", function() {
          const h = req.getHeaders();
          expect(h["x-frame-options"]).to.be.undefined;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
