info:
  name: getHeader
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: bruno
      value: is-awesome

runtime:
  scripts:
    - type: tests
      code: |-
        test("req.getHeader(name)", function() {
          const h = req.getHeader('bruno');
          expect(h).to.equal("is-awesome");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
