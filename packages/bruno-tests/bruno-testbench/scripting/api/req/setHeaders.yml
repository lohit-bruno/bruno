info:
  name: setHeaders
  type: http
  seq: 8

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: bruno
      value: is-awesome
    - name: della
      value: is-beautiful

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeaders({
          "content-type": "application/text",
          "transaction-id": "foobar"
        });
    - type: tests
      code: |-
        test("req.setHeaders()", function() {
          const h = req.getHeaders();
          expect(h['content-type']).to.equal("application/text");
          expect(h['transaction-id']).to.equal("foobar");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
