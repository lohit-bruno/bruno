info:
  name: getPathParam
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/:pathParam"
  params:
    - name: pathParam
      value: ping
      type: path

runtime:
  scripts:
    - type: tests
      code: |-
        test("req.getPathParams()", function() {
          const pathParams = req.getPathParams();
          expect(pathParams[0].name).to.equal('pathParam');
          expect(pathParams[0].value).to.equal('ping');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
