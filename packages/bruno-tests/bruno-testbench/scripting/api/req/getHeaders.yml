info:
  name: getHeaders
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: bruno
      value: is-awesome
    - name: della
      value: is-beautiful

runtime:
  scripts:
    - type: tests
      code: |-
        test("req.getHeaders()", function() {
          const h = req.getHeaders();
          expect(h.bruno).to.equal("is-awesome");
          expect(h.della).to.equal("is-beautiful");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
