info:
  name: setHeader
  type: http
  seq: 6

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: bruno
      value: is-awesome

runtime:
  scripts:
    - type: before-request
      code: req.setHeader('bruno', 'is-the-future');
    - type: tests
      code: |-
        test("req.setHeader(name)", function() {
          const h = req.getHeader('bruno');
          expect(h).to.equal("is-the-future");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
