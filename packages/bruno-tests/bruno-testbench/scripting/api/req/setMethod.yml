info:
  name: setMethod
  type: http
  seq: 4

http:
  method: POST
  url: "{{host}}/ping"

runtime:
  scripts:
    - type: before-request
      code: req.setMethod("GET");
    - type: tests
      code: |-
        test("req.setMethod()()", function() {
          const method = req.getMethod();
          expect(method).to.equal("GET");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
