info:
  name: getHost
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/ping"

runtime:
  scripts:
    - type: tests
      code: |-
        test("req.getHost()", function() {
          const host = req.getHost();
          expect(host).to.equal("testbench-sanity.usebruno.com");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
