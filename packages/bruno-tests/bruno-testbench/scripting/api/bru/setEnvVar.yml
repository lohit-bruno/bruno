info:
  name: setEnvVar
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/ping"

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("testSetEnvVar", "bruno-29653")
    - type: tests
      code: |-
        test("should set env var in scripts", function() {
          const testSetEnvVar = bru.getEnvVar("testSetEnvVar")
          expect(testSetEnvVar).to.equal("bruno-29653");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
