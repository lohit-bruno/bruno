info:
  name: getStatusText
  type: http
  seq: 6

http:
  method: GET
  url: "{{host}}/ping"

runtime:
  scripts:
    - type: tests
      code: |-
        test("res.getStatusText()", function() {
          const statusText = res.getStatusText()
          expect(statusText).to.equal('OK');
        });
  assertions:
    - expression: res.statusText
      operator: eq
      value: OK
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
