info:
  name: object
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/echo/json"
  body:
    type: json
    data: |-
      {
        "hello": "bruno"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        res.setBody({
          hello : "hello from post-res"
        })
    - type: tests
      code: |-
        test("res.setBody(object)", function() {
          const body = res.getBody();
          expect(body.hello).to.eql("hello from post-res");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
