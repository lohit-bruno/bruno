info:
  name: boolean
  type: http
  seq: 7

http:
  method: POST
  url: "{{host}}/api/echo/json"
  body:
    type: json
    data: |-
      {
        "hello": "bruno"
      }

runtime:
  scripts:
    - type: after-response
      code: res.setBody(true)
    - type: tests
      code: |-
        test("res.setBody(boolean)", function() {
          const body = res.getBody();
          expect(body).to.be.true;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
