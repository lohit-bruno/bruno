info:
  name: getHeaders
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/echo/json"
  body:
    type: json
    data: |-
      {
        "hello": "bruno"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("res.getHeaders(name)", function() {
          const h = res.getHeaders();
          expect(h['x-powered-by']).to.eql('Express');
          expect(h['content-length']).to.eql('17');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
