info:
  name: follow-redirect
  type: http
  seq: 1

http:
  method: GET
  url: "{{localhost}}/api/redirect/3"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("body should include redirecting", function() {
          const data = res.getBody();
          expect(data).to.include("Redirecting...");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
