info:
  name: test xml response
  type: http
  seq: 9

http:
  method: POST
  url: "{{httpfaker}}/api/echo/custom"
  body:
    type: json
    data: |-
      {
        "headers": { "content-type": "application/xml" },
        "content": "<message>hello</message>"
      }

runtime:
  assertions:
    - expression: res.body
      operator: eq
      value: <message>hello</message>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
