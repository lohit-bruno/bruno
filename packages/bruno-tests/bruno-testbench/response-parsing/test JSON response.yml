info:
  name: test JSON response
  type: http
  seq: 2

http:
  method: POST
  url: "{{httpfaker}}/api/echo/custom"
  body:
    type: json
    data: |-
      {
        "headers": { "content-type": "application/json" },
        "contentJSON": { "message": "hello" }
      }

runtime:
  assertions:
    - expression: res.body.message
      operator: eq
      value: hello

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
