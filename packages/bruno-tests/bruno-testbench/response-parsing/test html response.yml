info:
  name: test html response
  type: http
  seq: 5

http:
  method: POST
  url: "{{httpfaker}}/api/echo/custom"
  body:
    type: json
    data: |-
      {
        "headers": { "content-type": "text/html" },
        "content": "<h1>hello</h1>"
      }

runtime:
  assertions:
    - expression: res.body
      operator: eq
      value: <h1>hello</h1>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
